
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Art of Returning</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f1e9;
      color: #4d493f;
      font-family: Georgia, serif;
    }

    header {
      padding: 28px 8%;
      text-align: center;
      letter-spacing: 3px;
      font-size: 12px;
    }

    main {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 72px);
      font-weight: normal;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    p {
      font-size: 17px;
      line-height: 1.9;
      color: #81796c;
    }

    .line {
      width: 50px;
      height: 1px;
      background: #b7a994;
      margin: 30px auto;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 12px;
      color: #9b9182;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <header>
    RETURNNOON
  </header>

  <main>
    <h1>The Art of Returning</h1>
    <div class="line"></div>
    <p>
      A Private Visual Journal
      <br>
      A quiet space to return to yourself.
    </p>
  </main>

  <footer>
    WITHIN · ALWAYS
  </footer>

</body>
</html>
